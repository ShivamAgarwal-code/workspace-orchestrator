[project]
name = "workspace-orchestrator"
version = "0.1.0"
description = "Agentic Google Workspace Orchestrator - Gmail/Calendar/Drive natural language orchestration"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
