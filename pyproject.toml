[project]
name = "workspace-orchestrator"
version = "0.1.0"
description = "Agentic Google Workspace Orchestrator - Gmail/Calendar/Drive natural language orchestration"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: line length handled by editor wrapping, not worth enforcing here.
# B008: FastAPI's Depends()/Header()/Query() as default arguments is the documented, idiomatic
# pattern (FastAPI evaluates them once per request via its own DI system, not at import time).
ignore = ["E501", "B008"]
